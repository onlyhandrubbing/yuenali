async function overpass(lat,lng,r){const body='data='+encodeURIComponent(oq(lat,lng,r));const ctl=OVERPASS.map(()=>new AbortController());
  const one=(u,i)=>{const t=setTimeout(()=>ctl[i].abort(),18000);return fetch(u,{method:'POST',body,headers:{'Content-Type':'application/x-www-form-urlencoded'},signal:ctl[i].signal}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(j=>{if(!j||!j.elements)throw 0;return j}).finally(()=>clearTimeout(t))};
  const j=await Promise.any(OVERPASS.map((u,i)=>one(u,i).then(x=>{ctl.forEach((c,k)=>k!==i&&c.abort());return x})));
  return j.elements.map(e=>{const t=e.tags||{},la=e.lat??e.center?.lat,lo=e.lon??e.center?.lon;if(la==null||!t.name)return null;return{t,name:t['name:zh']||t.name,lat:la,lng:lo}}).filter(Boolean)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function nominatim(lat,lng,r,words){const dLat=r/111000,dLng=r/(111000*Math.cos(lat*Math.PI/180));const vb=[lng-dLng,lat+dLat,lng+dLng,lat-dLat].map(v=>v.toFixed(5)).join(',');const out=[];
  for(let i=0;i<words.length;i++){if(i)await sleep(1100);const r2=await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&bounded=1&limit=40&extratags=1&namedetails=1&accept-language=zh-TW&viewbox='+vb+'&q='+encodeURIComponent(words[i]));if(!r2.ok)throw 0;const j=await r2.json();
    j.forEach(x=>{const nd=x.namedetails||{},et=x.extratags||{};const name=nd['name:zh']||x.name||nd.name;if(!name)return;out.push({t:Object.assign({},et,{amenity:x.type}),name,lat:+x.lat,lng:+x.lon})})}
  return out}
const WORDS={meal:['restaurant','fast food'],chat:['cafe','restaurant'],drink:['bar','pub'],date:['restaurant','cafe'],bday:['restaurant','karaoke'],after:['bar','karaoke']};
async function getPlaces(lat,lng){let list=[];
  try{list=await overpass(lat,lng,800);if(list.length<25){list=list.concat(await overpass(lat,lng,1500))}}
  catch(e){list=await nominatim(lat,lng,900,WORDS[st.pur])}
  const seen=new Set();return list.filter(p=>{const k=p.name+'|'+p.lat.toFixed(4);if(seen.has(k))return false;seen.add(k);return true}).map(p=>Object.assign(p,{km:km(lat,lng,p.lat,p.lng),b:brandOf(p.name)}))}

/* scoring */
const CUI=c=>(c||'').toLowerCase();
const LABEL={restaurant:'餐廳',cafe:'咖啡廳',bar:'酒吧',pub:'酒館',fast_food:'速食小吃',food_court:'美食街',karaoke_box:'KTV',karaoke:'KTV'};
const CUILAB={japanese:'日式',korean:'韓式',chinese:'中式',taiwanese:'台式',hot_pot:'火鍋',barbecue:'燒肉',italian:'義式',pizza:'披薩',thai:'泰式',vietnamese:'越式',indian:'印度',american:'美式',burger:'漢堡',steak_house:'牛排',seafood:'海鮮',sushi:'壽司',ramen:'拉麵',noodle:'麵食',coffee_shop:'咖啡',dessert:'甜點',tea:'茶',vegetarian:'素食',vegan:'蔬食',breakfast:'早午餐',french:'法式',buffet:'吃到飽',izakaya:'居酒屋'};
function lateOpen(h){if(!h)return false;if(/24\/7/.test(h))return true;return /-(2[3-9]|0[0-5]):/.test(h)||/-24:00/.test(h)}
function score(p){const t=p.t,a=t.amenity==='karaoke'||t.leisure==='karaoke'?'karaoke_box':t.amenity,c=CUI(t.cuisine),b=p.b,why=[],warn=[];let s=0;
  const P={meal:{restaurant:3,food_court:1.5,fast_food:1},chat:{cafe:3.5,restaurant:1.2},drink:{bar:3.5,pub:3.5,restaurant:.6},date:{restaurant:2.5,cafe:2.2,bar:1.6},bday:{restaurant:3,karaoke_box:2.5},after:{bar:3,pub:3,karaoke_box:3,cafe:.8}}[st.pur];
  s+=P[a]||-3;if((P[a]||0)<=0)return null;
  if(st.pur==='date'&&/italian|french|japanese|steak|sushi|izakaya/.test(c)){s+=1.5;why.push('適合約會')}
  if(st.pur==='bday'&&(/hot_pot|barbecue|buffet/.test(c)||b.bday)){s+=2;why.push(a==='karaoke_box'?'唱歌慶生最熱鬧':b.bday?'適合慶生':'大家一起吃最熱鬧')}
  if(st.pur==='drink'&&/izakaya/.test(c)){s+=1.5;why.push('居酒屋')}
  // group size
  if(st.ppl>=5){if(b.big||/hot_pot|barbecue|chinese|buffet|izakaya/.test(c)||a==='karaoke_box'||a==='food_court'){s+=2;why.push('多人好坐')}else if(b.small||a==='cafe')s-=1.2}
  if(st.ppl<=2&&a==='karaoke_box')s-=1;
  // budget
  const price=b.price||(a==='fast_food'||a==='food_court'||/noodle|taiwanese|dumpling|bubble/.test(c)?1:/steak|french|sushi|buffet|barbecue/.test(c)||a==='bar'?3:2);
  s-=Math.abs(price-st.bud)*1.2;if(price===st.bud)why.push(['','平價','價位剛好','有質感'][price]);
  // needs
  const N=new Set(st.need);
  if(N.has('quiet')){if(b.quiet||((a==='cafe'||/japanese|italian|french|tea/.test(c))&&!b.noisy)){s+=2;why.push('比較安靜')}else if(b.noisy||a==='bar'||a==='pub'||a==='karaoke_box'||/hot_pot|barbecue/.test(c)){s-=2.5;warn.push('可能比較吵')}}
  if(N.has('nolimit')){if(b.nolimit){s+=2.5;why.push('多半不限時')}else if(/buffet|hot_pot|barbecue/.test(c)||b.bday){s-=1.5;warn.push('常有用餐時限')}else warn.push('時限請先問')}
  if(N.has('plug')){if(/wlan|yes|free/.test(t.internet_access||'')||b.plug){s+=2;why.push('有 Wi-Fi／插座')}else s-=.5}
  if(N.has('reserve')){if(/yes|recommended|required/.test(t.reservation||'')||b.reserve){s+=2;why.push('可訂位')}else if(a==='fast_food'||a==='food_court'){s-=2}else warn.push('訂位請先打電話')}
  if(N.has('room')){if(b.room||a==='karaoke_box'){s+=3;why.push('有包廂')}else{s-=1;warn.push('包廂請先問')}}
  if(N.has('late')){if(lateOpen(t.opening_hours)||b.late){s+=2.5;why.push('開得晚')}else s-=1.5}
  if(N.has('pet')){if(/yes|leashed|outside/.test(t.dog||'')||b.pet){s+=3;why.push('寵物友善')}else s-=1}
  if(N.has('veg')){if(/yes|only/.test((t['diet:vegetarian']||'')+(t['diet:vegan']||''))||b.veg||/vegetarian|vegan/.test(c)){s+=3;why.push('有素食')}else s-=.8}
  if(st.purTxt){const re=st.kw?new RegExp(st.kw,'i'):null;const nm=p.name+' '+(t['name:en']||'');
    if((re&&(re.test(c)||re.test(nm)))||nm.includes(st.purTxt.slice(0,4))){s+=4;why.unshift(`符合「${st.purTxt}」`)}else if(st.kw)s-=1.5}
  for(const x of st.needX){const m=XNEED.find(([re])=>re.test(x));const cr=crowd[keyOf(p)];const said=cr&&cr.notes.some(n=>n.includes(x.slice(0,2)));
    if((m&&m[1](t))||said){s+=2;why.push(x)}else warn.push(`「${x}」請先問`)}
  if(t.outdoor_seating==='yes'&&st.pur!=='bday'&&!st.needX.some(x=>/戶外/.test(x)))why.push('有戶外座位');
  if(b.note){const kw=['不限時','慶生','可訂位','安靜'];for(const k of kw)if(b.note.includes(k))for(let i=why.length-1;i>=0;i--)if(why[i].includes(k))why.splice(i,1);why.unshift(b.note)}
  s-=p.km*3;
  let cl=(c.split(/[;,]/).map(x=>CUILAB[x.trim()]).find(Boolean)||'');if(a==='cafe'&&cl==='咖啡')cl='';const kind=cl+(LABEL[a]||'');
  return{p,s,why:[...new Set(why)].slice(0,4),warn:warn.slice(0,3),kind,hours:t.opening_hours||''}}

let ranked=[],page=0;
function pick3(){const pool=ranked.slice(page*3),out=[],brands=new Set(),kinds={};const bk=r=>r.p.name.replace(/\s.*$/,'').slice(0,4);
  for(const pass of [1,2,9])for(const r of pool){if(out.length===3)break;if(out.includes(r)||brands.has(bk(r)))continue;if((kinds[r.kind]||0)>=pass)continue;if(pass<9&&pool[0]&&r.s<pool[0].s-4)continue;out.push(r);brands.add(bk(r));kinds[r.kind]=(kinds[r.kind]||0)+1}
  return out.sort((a,b)=>b.s-a.s)}

/* ---------- crowd feedback ---------- */
const TAGS=[['up','👍 推薦'],['down','👎 不推'],['quiet','🤫 安靜'],['loud','📢 很吵'],['nolimit','♾️ 不限時'],['limit','⏳ 有限時'],['reserve','📞 可訂位'],['group','🪑 多人好坐'],['plug','🔌 有插座']];
const TAGTXT=Object.fromEntries(TAGS);
const keyOf=p=>(p.name+'@'+p.lat.toFixed(3)+','+p.lng.toFixed(3));
let crowd={};
function addFeed(rec){if(!rec||!rec.k)return;const c=crowd[rec.k]||(crowd[rec.k]={n:0,tags:{},notes:[]});c.n++;(rec.v||[]).forEach(t=>{if(TAGTXT[t])c.tags[t]=(c.tags[t]||0)+1});if(rec.c)c.notes.push(String(rec.c).slice(0,80))}
function parseCSV(t){const rows=[];let r=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(f);f=''}else if(ch==='\n'){r.push(f);rows.push(r);r=[];f=''}else if(ch!=='\r')f+=ch}if(f||r.length){r.push(f);rows.push(r)}return rows}
async function loadFeed(){crowd={};LS.get('yn_mine',[]).forEach(addFeed);
  if(!FEED.csv)return;try{const r=await fetch(FEED.csv+(FEED.csv.includes('?')?'&':'?')+'t='+Math.floor(Date.now()/60000));const rows=parseCSV(await r.text());
    const mine=new Set(LS.get('yn_mine',[]).map(x=>x.id));rows.slice(1).forEach(row=>{try{const rec=JSON.parse(row[1]||'{}');if(!mine.has(rec.id))addFeed(rec)}catch(e){}})}catch(e){}}
function crowdLine(p){const c=crowd[keyOf(p)];if(!c)return`<div class="crowd"><span class="none">還沒有人回饋，去過的話幫大家說一句吧。</span></div>`;
  const tags=Object.entries(c.tags).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([t,n])=>`${TAGTXT[t]} ${n}`).join('　');
  const note=c.notes.length?` <q>${esc(c.notes[c.notes.length-1])}</q>`:'';return`<div class="crowd">👥 ${c.n} 人回饋：${tags}${note}</div>`}
function crowdScore(p){const c=crowd[keyOf(p)];if(!c)return 0;const g=t=>c.tags[t]||0;const N=new Set(st.need);let s=(g('up')-g('down'))*.6;
  if(N.has('quiet'))s+=(g('quiet')-g('loud'))*.8;if(N.has('nolimit'))s+=(g('nolimit')-g('limit'))*.8;if(N.has('reserve'))s+=g('reserve')*.6;if(st.ppl>=5)s+=g('group')*.6;if(N.has('plug'))s+=g('plug')*.6;return Math.max(-3,Math.min(3,s))}
function openFeedback(p){let picked=[];openSheet(`<h4>${esc(p.name)}</h4><p class="sub">去過嗎？點一點幫下一個人。</p>${opts(TAGS,[],true)}<textarea id="fbTxt" maxlength="80" placeholder="一句話建議（選填），例如：二樓比較安靜、週末限時 90 分"></textarea><button class="btn dark" id="fbOk" type="button">送出</button>`,sh=>{
  sh.querySelector('.opts').onclick=e=>{const b=e.target.closest('.opt');if(!b)return;const v=b.dataset.v;picked=picked.includes(v)?picked.filter(x=>x!==v):picked.concat(v);b.setAttribute('aria-pressed',picked.includes(v))};
  sh.querySelector('#fbOk').onclick=()=>{const c=sh.querySelector('#fbTxt').value.trim().replace(/\s+/g,' ').slice(0,80);if(!picked.length&&!c){toast('至少點一個或寫一句');return}
    const rec={id:Math.random().toString(36).slice(2,10),k:keyOf(p),n:p.name,v:picked,c,ts:Date.now()};
    const mine=LS.get('yn_mine',[]);mine.push(rec);LS.set('yn_mine',mine.slice(-200));addFeed(rec);
    if(FEED.form&&FEED.entry){const fd=new URLSearchParams();fd.append(FEED.entry,JSON.stringify(rec));fetch(FEED.form,{method:'POST',mode:'no-cors',body:fd}).catch(()=>{})}
    closeSheet();renderCards();toast('謝謝！你的回饋會幫到下一個人')}})}

function hoursShort(h){if(!h)return'';if(/24\/7/.test(h))return'24 小時';const m=h.match(/-(\d{2}):(\d{2})/);return m?`營業到 ${m[1]>23?String(m[1]-24).padStart(2,'0'):m[1]}:${m[2]}`:''}

    <div class="reasons">${r.why.map(w=>`<span>✓ ${esc(w)}</span>`).join('')}${r.warn.map(w=>`<span class="no">？${esc(w)}</span>`).join('')}</div>
    ${crowdLine(p)}
    <div class="acts"><a href="${gm(p)}" target="_blank" rel="noopener">地圖・評論</a>${v?`<a href="${buyUrl(v)}" target="_blank" rel="noopener sponsored">蝦皮找餐券</a>`:''}<button class="fb" type="button" data-i="${i}">💬 我去過</button></div></article>`}).join('');
  $('cards').querySelectorAll('.fb').forEach(b=>b.onclick=()=>openFeedback(three[+b.dataset.i].p))}
function render(){three=pick3();$('res').hidden=false;
  if(!three.length){$('cards').innerHTML='<div class="card" style="--lc:var(--muted)">附近找不到符合的店。少選一兩個條件，或換個地點試試。</div>';$('voteTxt').textContent='';$('prep').innerHTML='';return}
  renderCards();
  const pr=PREP[st.pur]||[];$('prep').innerHTML=pr.length?'出門前：'+pr.map(([l,k])=>`<a href="${buyUrl(k)}" target="_blank" rel="noopener sponsored">${l}</a>`).join('')+((st.pur==='bday'||st.pur==='date')?'<a href="https://onlyhandrubbing.github.io/liwu/" target="_blank" rel="noopener">🎁 送什麼禮物</a>':''):'';
  $('voteTxt').textContent=`📍 ${st.label||st.place}附近・${purText()}・${pplText()}\n要去哪間？回 A／B／C 投票 🙋\n\n`+three.map((r,i)=>`${'ABC'[i]}｜${r.p.name}（${r.kind||'餐飲'}，走路 ${walk(r.p.km)} 分）\n${gm(r.p)}`).join('\n\n')+`\n\n（用「約哪裡」選的：${SITE}）`}
async function go(){
  try{
    if(!st.place&&st.lat==null){openSlot('where');return}
    if(st.place&&st.lat==null){msg(`正在找「${st.place}」…`);const g=await geocode(st.place);if(!g){msg(`找不到「${st.place}」，換個寫法試試，例如加上縣市。`);return}Object.assign(st,g);save()}
    msg('正在找附近的店…');$('go').disabled=true;
    const [places]=await Promise.all([getPlaces(st.lat,st.lng),loadFeed()]);
    ranked=places.map(p=>{const r=score(p);if(r)r.s+=crowdScore(p);return r}).filter(Boolean).sort((a,b)=>b.s-a.s);page=0;
    msg('');$('resNote').textContent=places.length?`附近 ${places.length} 間裡最合的`:'';
    render();$('res').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(e){msg('店家資料讀取失敗，等幾秒再按一次。')}finally{$('go').disabled=false}}
$('go').onclick=go;
$('again').onclick=()=>{page++;if(page*3>=ranked.length)page=0;render();$('res').scrollIntoView({behavior:'smooth',block:'start'})};
let tt;const toast=s=>{$('toast').textContent=s;$('toast').hidden=false;clearTimeout(tt);tt=setTimeout(()=>$('toast').hidden=true,2400)};
$('copyVote').onclick=()=>{const t=$('voteTxt').textContent;navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast('已複製，貼到群組讓大家投 A／B／C')).catch(()=>toast('複製不了，請打開下面的內容手動複製')):toast('複製不了，請打開下面的內容手動複製')};
drawAsk();
window.__yn={st,setRanked:(list,lat,lng)=>{ranked=list.map(p=>Object.assign(p,{km:km(lat,lng,p.lat,p.lng),b:brandOf(p.name)})).map(p=>{const r=score(p);if(r)r.s+=crowdScore(p);return r}).filter(Boolean).sort((a,b)=>b.s-a.s);page=0;st.label=st.label||'測試地點';render()},addFeed,openFeedback,keyOf};
})();
</script>
